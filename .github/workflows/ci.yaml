name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff formatter check
        run: ruff format --check src tests

      - name: Run type checking
        run: mypy src

      - name: Run tests
        run: pytest --cov=src/llm_regress --cov-report=term-missing

  prompt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install llm-regress
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run prompt tests (offline with mock provider)
        run: llm-regress run examples/ --output results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-test-results
          path: results.json
