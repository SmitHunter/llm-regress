[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-regress"
version = "0.1.0"
description = "Regression testing framework for LLM prompts and models, designed for CI pipelines"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hunter Smith" }
]
keywords = [
    "llm",
    "testing",
    "prompts",
    "regression",
    "ci",
    "openai",
    "anthropic",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.25",
    "jsonschema>=4.0",
    "jinja2>=3.0",
    "tenacity>=8.0",
    "xxhash>=3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]
semantic = ["sentence-transformers>=2.2"]
all = [
    "openai>=1.0",
    "anthropic>=0.18",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML",
    "types-jsonschema",
    "build",
    "twine",
]

[project.entry-points."llm_regress.providers"]
openai = "llm_regress.providers:OpenAIProvider"
anthropic = "llm_regress.providers:AnthropicProvider"
mock = "llm_regress.providers:MockProvider"

[project.scripts]
llm-regress = "llm_regress.cli:main"
llmr = "llm_regress.cli:main"

[project.urls]
Homepage = "https://github.com/SmitHunter/llm-regress"
Documentation = "https://github.com/SmitHunter/llm-regress#readme"
Repository = "https://github.com/SmitHunter/llm-regress"
Issues = "https://github.com/SmitHunter/llm-regress/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/LICENSE",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_regress"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src/llm_regress", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "RUF022", # unsorted __all__ - we prefer logical grouping
]

[tool.ruff.lint.isort]
known-first-party = ["llm_regress"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "anthropic.*",
    "sentence_transformers.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/llm_regress"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
